[package]
name = "qv-sim"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "QuantumVerse dense statevector simulator — native and wasm32-unknown-unknown with a manual C-style ABI (no wasm-bindgen)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
