<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuantumVerse Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='24' font-size='24'%3E%E2%9A%9B%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="./tokens.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.55; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code { font-family: var(--mono); font-size: .85em; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
  .mono { font-family: var(--mono); }
  .muted { color: var(--muted); }
  .small { font-size: .82rem; }

  header.top { border-bottom: 1px solid var(--line); position: sticky; top: 0; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); z-index: 10; }
  .bar { max-width: 1120px; margin: 0 auto; padding: 12px clamp(16px, 4vw, 40px); display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .wordmark { display: flex; align-items: baseline; gap: 9px; }
  .wordmark .ket { font-family: var(--mono); color: var(--accent); font-weight: 700; }
  .wordmark .name { font-family: var(--serif); font-weight: 600; font-size: 1.08rem; }
  nav.hub-nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav.hub-nav a { font-family: var(--mono); font-size: .78rem; color: var(--muted); padding: 6px 11px; border-radius: 7px; }
  nav.hub-nav a:hover { background: var(--surface); text-decoration: none; }
  nav.hub-nav a.active { color: var(--accent); background: var(--surface); }
  .spacer { flex: 1; }
  #search-box { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; font-family: var(--mono); font-size: .8rem; color: var(--ink); min-width: 160px; }
  .ext { font-family: var(--mono); font-size: .76rem; }

  main { max-width: 1120px; margin: 0 auto; padding: clamp(22px, 4vw, 44px) clamp(16px, 4vw, 40px) 80px; }
  h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(1.5rem, 3vw, 2.1rem); margin: 0 0 6px; }
  h3 { font-size: .96rem; font-weight: 600; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .lead { font-size: 1.05rem; color: var(--muted); max-width: 60ch; margin: 6px 0 18px; }

  .crumbs { font-size: .74rem; color: var(--muted); margin-bottom: 12px; }
  .crumbs .sep { margin: 0 7px; color: var(--wire); }

  /* home */
  .hero { padding: 20px 0 8px; }
  .hero h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-top: 26px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 4px; box-shadow: var(--card-shadow); }
  .stat:hover { text-decoration: none; border-color: var(--accent); }
  .stat-n { font-family: var(--serif); font-size: 2.1rem; font-weight: 600; color: var(--accent); }
  .stat-l { font-family: var(--mono); font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

  /* filters */
  .filters { display: flex; gap: 6px; margin: 4px 0 20px; flex-wrap: wrap; }
  .filter { font-family: var(--mono); font-size: .74rem; padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
  .filter:hover { text-decoration: none; }
  .filter.active { color: var(--accent); border-color: var(--accent); }

  /* grids + tiles */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 16px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--card-shadow); }
  .tile:hover { text-decoration: none; border-color: var(--accent); }
  .tile-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .tile-name { font-size: .84rem; font-weight: 600; color: var(--ink); word-break: break-all; }
  .tile-summary { font-size: .86rem; color: var(--muted); margin: 0; }
  .tile-foot { font-size: .7rem; color: var(--muted); }
  .res { font-size: .72rem; color: var(--accent); }

  /* chips */
  .chips { display: flex; gap: 7px; flex-wrap: wrap; margin: 10px 0 16px; }
  .chip { font-family: var(--mono); font-size: .68rem; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .chip.type { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .chip.trust-1 { color: var(--good); border-color: var(--good); }
  .chip.trust-2 { color: var(--good); border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, transparent); }
  .cert-badge { font-family: var(--mono); font-size: .68rem; padding: 4px 0 0; }
  .cert-badge.ok { color: var(--good); }
  .cert-badge.fail { color: #C0392B; }

  /* rows */
  .rows { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 11px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
  .row:last-child { border-bottom: none; }
  .row:hover { text-decoration: none; background: var(--surface-2); }
  .row-id { font-size: .8rem; color: var(--accent); white-space: nowrap; }
  .row-title { flex: 1; color: var(--ink); font-size: .9rem; }
  .row-date { font-size: .74rem; white-space: nowrap; }

  /* detail */
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-top: 8px; }
  @media (max-width: 820px) { .detail-grid { grid-template-columns: 1fr; } }
  .card-block { background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 16px 18px; margin-bottom: 14px; box-shadow: var(--card-shadow); }
  .card-block.computed { border-left: 3px solid var(--accent); }
  .card-block.claimed { border-left: 3px solid var(--wire); }
  .card-block.verified { border-left: 3px solid var(--good); }
  .tag-computed, .tag-claimed, .tag-verified { font-family: var(--mono); font-size: .6rem; letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; }
  .tag-computed { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .tag-claimed { color: var(--muted); background: var(--surface-2); }
  .tag-verified { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }

  dl.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; font-size: .82rem; }
  dl.kv dt { color: var(--muted); }
  dl.kv dd { margin: 0; color: var(--ink); word-break: break-word; }
  ul.plain { list-style: none; padding: 0; margin: 0; }
  ul.plain li { padding: 3px 0; }
  ul.plain li.pass, .pass { color: var(--good); }
  ul.plain li.fail, .fail { color: #C0392B; }

  pre.code { background: var(--code-bg); color: var(--code-ink); font-family: var(--mono); font-size: .78rem; border-radius: 10px; padding: 14px; overflow: auto; max-height: 460px; }

  .actions { display: flex; align-items: center; gap: 16px; margin: 6px 0 18px; flex-wrap: wrap; }
  .btn { background: var(--accent-fill); color: #fff; border-radius: 8px; padding: 8px 16px; font-family: var(--mono); font-size: .78rem; font-weight: 600; }
  .btn:hover { filter: brightness(1.08); text-decoration: none; }

  /* bars (capsule counts) */
  .bars { display: flex; flex-direction: column; gap: 6px; }
  .bar-row { display: grid; grid-template-columns: minmax(48px,auto) 1fr 54px; gap: 10px; align-items: center; font-size: .76rem; }
  .bar-track { background: var(--surface-2); border-radius: 5px; height: 15px; overflow: hidden; }
  .bar-fill { background: var(--accent-fill); height: 100%; border-radius: 5px; }
  .bar-val { text-align: right; }

  /* timeline */
  .timeline { display: flex; flex-direction: column; gap: 8px; }
  .tl-row { display: grid; grid-template-columns: 150px 1fr auto; gap: 12px; align-items: baseline; font-size: .78rem; padding-bottom: 8px; border-bottom: 1px dashed var(--line); }
  .tl-row:last-child { border-bottom: none; }
  .tl-when { font-size: .72rem; }

  /* board table */
  table.board { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: .86rem; }
  table.board th { text-align: left; font-family: var(--mono); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); }
  table.board td { padding: 10px; border-bottom: 1px solid var(--line); }
  table.board .rank { font-family: var(--serif); font-weight: 600; color: var(--accent); }
  table.board .score { font-weight: 600; }

  .empty { text-align: center; padding: 60px 20px; }
  .empty h2 { font-family: var(--serif); }
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <a class="wordmark" href="#/"><span class="ket">|qv⟩</span> <span class="name">QuantumVerse</span></a>
    <nav class="hub-nav" aria-label="Sections">
      <a data-route="home" href="#/">Home</a>
      <a data-route="artifacts" href="#/artifacts">Artifacts</a>
      <a data-route="capsules" href="#/capsules">Capsules</a>
      <a data-route="devices" href="#/devices">Devices</a>
      <a data-route="boards" href="#/boards">Leaderboards</a>
    </nav>
    <span class="spacer"></span>
    <input id="search-box" type="search" placeholder="search artifacts…" aria-label="Search artifacts">
    <a class="ext" href="./index.html">Playground ↗</a>
  </div>
</header>
<main id="view"></main>
<script type="module">
  import { start } from './hub.js';
  start();
</script>
</body>
</html>
